# Continuous integration gate for pull requests, plus a manually triggered job for the checks that
# need Docker services this VDI-authored codebase cannot run locally (phase-6 plan
# docs/12-appendix/05-phase6-implementation-kit-plan.md §8; pipeline definitions in
# docs/10-development/05-ci-cd.md §3-§4). This file intentionally implements only the subset of that
# design that exists today (uv workspace, ruff, mypy, import-linter, pytest, the two Node contract/doc
# validators); the remaining jobs the CI/CD doc describes (license gate, generated-artifact diff,
# coverage, security/chaos/quality-gate, image scan, release pipelines, ...) are added by the work
# packages that introduce the tools they depend on. Job names loosely follow the doc's
# `{workflow} / {job}` convention (§3.2) for the jobs that already have a real command to run.
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the version verified on the VDI (2026-09-23); bump alongside `uv.lock` maintenance.
  UV_VERSION: "0.12.x"

jobs:
  # ---------------------------------------------------------------------------------------------
  # PR gate: uv install -> uv sync -> ruff -> mypy -> lint-imports -> pytest -q (deferred markers
  # excluded by pyproject addopts) -> validate-contracts.mjs -> audit-docs.mjs.
  # Split into independent jobs (CI/CD doc §4.7: jobs run without `needs` between them) so a failure
  # in one gate does not hide the others; each job repeats the same setup because GitHub Actions has
  # no cross-job filesystem sharing without an explicit upload/download-artifact round trip.
  # ---------------------------------------------------------------------------------------------
  lint:
    name: pr / lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --all-packages --all-extras --group dev
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .

  typecheck:
    name: pr / typecheck
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --all-packages --all-extras --group dev
      - name: mypy --strict (src/)
        run: uv run mypy src

  imports:
    name: pr / imports
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --all-packages --all-extras --group dev
      - name: import-linter (layers, D-17, adapters-no-storage, contracts-pure, no-c-grade, testing-not-in-production)
        run: uv run lint-imports

  test:
    name: pr / unit (${{ matrix.python-version }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --frozen --all-packages --all-extras --group dev --python ${{ matrix.python-version }}
      - name: pytest -q (deferred-tier markers excluded, pyproject addopts)
        run: uv run --python ${{ matrix.python-version }} pytest -q

  contracts:
    name: pr / contracts
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: validate-contracts.mjs (schema syntax, envelope gate, bible sec. 5.7 enum cross-check, inventory coverage)
        run: node tools/validate-contracts.mjs --root .

  docs:
    name: pr / docs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: audit-docs.mjs (links, frontmatter, spelling/rejected names, citations, confirm-needed, schema inventory)
        run: node tools/audit-docs.mjs --root .

  # ---------------------------------------------------------------------------------------------
  # Deferred tiers (phase-6 plan §8 tier 2): manually triggered because it needs Docker service
  # containers this VDI cannot run. Brings up PostgreSQL, Qdrant and Valkey and runs only the tests
  # marked `needs_docker`; tier 2b (`needs_model`), tier 3 (`needs_gpu`) and `needs_network` still need
  # a machine with model-weight access, a GPU, or outbound network respectively (see
  # docs/12-appendix/09-deferred-verification-ledger.md and tools/verify/run-deferred.sh / .ps1).
  # ---------------------------------------------------------------------------------------------
  deferred:
    name: deferred / needs_docker
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag_ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports:
          - 6333:6333
          - 6334:6334
      valkey:
        image: valkey/valkey:9
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Canonical settings names (design bible §6.6); point them at the service containers above.
      RAG_PG__DSN: postgresql://rag:rag@localhost:5432/rag_ledger
      RAG_VALKEY__URL: redis://localhost:6379
      RAG_QDRANT__URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --all-packages --all-extras --group dev
      - name: wait for Qdrant readiness (no built-in healthcheck binary in the image)
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6333/readyz && exit 0
            sleep 2
          done
          echo "Qdrant did not become ready in time" >&2
          exit 1
      - name: pytest -m needs_docker
        # Exit code 5 ("no tests collected") is not a failure: it just means no test in this
        # revision is marked needs_docker yet (see the deferred-verification ledger).
        run: |
          uv run pytest -q -m needs_docker
          code=$?
          if [ "$code" -eq 5 ]; then exit 0; fi
          exit $code
