      <ol>
        <li>1. 청구서 접수</li>
        <li>2. 담당부서 배정

            <li>- 부서장 검토</li>
            <li>- 공개 여부 결정</li>
          </ul>
        </li>
        <li>3. 결과 통지</li>
      </ol>

      <blockquote>

        <p>자세한 절차는 관련 법령을 참고하시기 바랍니다.</p>
