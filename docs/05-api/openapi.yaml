            - "null"
      required:
        - items
        - next_cursor
      additionalProperties: false
    VersionInfo:
      type: object
      description: GET /v1/version 응답(단일 인스턴스 자원; 바이블 §6.7·§14 1.3.0 AM-39, 04 §10.2)
      properties:
        platform_version:
          $ref: "#/components/schemas/Semver"
        api_version:
          type: string
          description: "/v1 경로 major(01 §16)"
        contracts_compat:
          type: string
          description: 게시 계약의 schema_version 허용 범위 문법(03-contracts/14 §4.3)
        schemas_bundle_hash:
          $ref: "#/components/schemas/Hex64"
        build:
          type: object
          properties:
            commit:
              type: string
            built_at:
              $ref: "#/components/schemas/DateTime"
          additionalProperties: false
      required:
        - platform_version
        - api_version
        - contracts_compat
      additionalProperties: false
    UnmaskRequest:
      type: object
      description: POST /v1/documents/{document_id}/unmask 본문(04 §12.2, pii_officer 전용)
      properties:
        tokens:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 100
      required:
        - tokens
      additionalProperties: false
    UnmaskResult:
      type: object
      description: POST /v1/documents/{document_id}/unmask 응답
      properties:
        document_id:
          $ref: "#/components/schemas/Ulid"
        items:
          type: array
          items:
            type: object
            properties:
              token:
                type: string
              value:
                type: string
              category:
                type: string
            required:
              - token
              - value
              - category
            additionalProperties: false
        unresolved:
          type: array
          items:
            type: string
      required:
        - document_id
        - items
        - unresolved
      additionalProperties: false
    Subscription:
      type: object
      description: 웹훅 구독(07 §3.1). secret 은 생성 응답에만 1회 노출
      properties:
        subscription_id:
          $ref: "#/components/schemas/Ulid"
        tenant_id:
          $ref: "#/components/schemas/Ulid"
          readOnly: true
        webhook_url:
          type: string
          format: uri
          maxLength: 2048
          description: https 기본(http 는 테넌트 옵트인). userinfo·프래그먼트 금지. EgressPolicy 통과
        events:
          type: array
          items:
            $ref: "#/components/schemas/EventType"
          minItems: 1
          maxItems: 24
          uniqueItems: true
        secret_ref:
          type: string
          readOnly: true
          description: 서명 키 간접 참조
        active:
          type: boolean
          default: true
        collection_ids:
          type: array
          items:
            $ref: "#/components/schemas/Ulid"
          description: 컬렉션 필터. 생략 = 테넌트 전체
        sampling:
          type: object
          additionalProperties:
            type: number
            exclusiveMinimum: 0
            maximum: 1
          description: 이벤트 이름별 전달 비율(샘플링 가능 이벤트만)
        description:
          type: string
          maxLength: 256
        secret:
          type: string
          description: rag_whs_ + base64url 43자. 생성·회전 응답에만
        stats:
          type: object
          properties:
            delivered_total:
              type: integer
            exhausted_total:
              type: integer
            last_delivered_at:
              oneOf:
                - $ref: "#/components/schemas/DateTime"
                - type: "null"
            last_failure_at:
              oneOf:
                - $ref: "#/components/schemas/DateTime"
                - type: "null"
          additionalProperties: false
        created_at:
          $ref: "#/components/schemas/DateTime"
        updated_at:
          $ref: "#/components/schemas/DateTime"
      required:
        - subscription_id
        - tenant_id
        - webhook_url
        - events
        - secret_ref
        - created_at
        - updated_at
      additionalProperties: false
    SubscriptionCreateRequest:
      type: object
      description: POST /v1/subscriptions 본문(07 §3.6). 서명 비밀은 서버가 생성한다(클라이언트 지정 불가)
      properties:
        webhook_url:
          type: string
          format: uri
          maxLength: 2048
        events:
          type: array
          items:
            $ref: "#/components/schemas/EventType"
          minItems: 1
          maxItems: 24
          uniqueItems: true
        collection_ids:
          type: array
          items:
            $ref: "#/components/schemas/Ulid"
        sampling:
          type: object
          additionalProperties:
            type: number
            exclusiveMinimum: 0
            maximum: 1
        active:
          type: boolean
          default: true
        description:
          type: string
          maxLength: 256
      required:
        - webhook_url
        - events
      additionalProperties: false
    EvalDatasetCreateRequest:
      type: object
      description: POST /v1/eval/datasets 본문 = EvalDataset 에서 readOnly(dataset_id, content_hash, created_at) 제외(04 §9). qrels_ref·answer_spans_ref 는 이미 업로드된 ArtifactRef
      properties:
        schema_version:
          $ref: "#/components/schemas/Semver"
        name:
          type: string
          pattern: ^[a-z][a-z0-9-]*$
        qrels_ref:
          $ref: "#/components/schemas/ArtifactRef"
        answer_spans_ref:
          $ref: "#/components/schemas/ArtifactRef"
        topics_ref:
          $ref: "#/components/schemas/ArtifactRef"
        corpus_collection_id:
          $ref: "#/components/schemas/Ulid"
        judgment_level:
          $ref: "#/components/schemas/JudgmentLevel"
        relevance_max:
          type: integer
          minimum: 1
        label_provenance:
          $ref: "#/components/schemas/LabelProvenance"
        license:
          type: string
        language:
          $ref: "#/components/schemas/Bcp47"
      required:
        - name
        - qrels_ref
        - answer_spans_ref
        - corpus_collection_id
        - judgment_level
        - label_provenance
        - license
      additionalProperties: false
    EvalRunCreateRequest:
      type: object
      description: POST /v1/eval/runs 본문(이 문서 초안; 04 §9 는 본문 형식을 명시하지 않아 EvalRun 의 클라이언트 지정 가능 필드로 구성). 응답은 202 JobStatus(kind=evaluate) + Link rel="related" 로 run_id 전달
      properties:
        dataset_id:
          $ref: "#/components/schemas/Ulid"
        profile_id:
          type: string
        profile_version:
          $ref: "#/components/schemas/Semver"
        metrics_requested:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 64
        judge_model:
          type:
            - string
            - "null"
        experiment_id:
          type:
            - string
            - "null"
        baseline_run_id:
          $ref: "#/components/schemas/Ulid"
      required:
        - dataset_id
        - profile_id
        - metrics_requested
      additionalProperties: false
    HealthStatus:
      type: object
      description: GET /healthz 본문(01 §21.4). 의존 검사 없음
      properties:
        status:
          type: string
          const: ok
      required:
        - status
      additionalProperties: false
    ComponentCheck:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
            - unavailable
        latency_ms:
          type: integer
          minimum: 0
      required:
        - status
      additionalProperties: false
    ReadyStatus:
      type: object
      description: GET /readyz 본문(01 §21.4, 04 §10.1 제안). 필수 의존(pg, object_store, vector_backend, plugin_registry, schemas) 불가 → 503
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
            - unavailable
        checks:
          type: object
          properties:
            pg:
              $ref: "#/components/schemas/ComponentCheck"
            valkey:
              $ref: "#/components/schemas/ComponentCheck"
            object_store:
              $ref: "#/components/schemas/ComponentCheck"
            vector_backend:
              $ref: "#/components/schemas/ComponentCheck"
            lexical_backend:
              $ref: "#/components/schemas/ComponentCheck"
            temporal:
              $ref: "#/components/schemas/ComponentCheck"
            plugin_registry:
              $ref: "#/components/schemas/ComponentCheck"
            schemas:
              $ref: "#/components/schemas/ComponentCheck"
          additionalProperties:
            $ref: "#/components/schemas/ComponentCheck"
      required:
        - status
        - checks
      additionalProperties: false
    SidecarHealth:
      type: object
      description: "사이드카 GET /healthz 본문(바이블 §14: 모델·JVM·LibreOffice 준비 상태; /readyz 와 같은 형식)"
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
            - unavailable
        checks:
          type: object
          properties:
            jvm:
              $ref: "#/components/schemas/ComponentCheck"
            libreoffice:
              $ref: "#/components/schemas/ComponentCheck"
            models:
              $ref: "#/components/schemas/ComponentCheck"
          additionalProperties:
            $ref: "#/components/schemas/ComponentCheck"
        image_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
      required:
        - status
        - checks
      additionalProperties: false
    ProtectedResourceMetadata:
      type: object
      description: RFC 9728 Protected Resource Metadata(05 §3.1). authorization_servers 가 없으면 API 키 모드
      properties:
        resource:
          type: string
          format: uri
        authorization_servers:
          type: array
          items:
            type: string
            format: uri
        bearer_methods_supported:
          type: array
          items:
            type: string
            enum:
              - header
        scopes_supported:
          type: array
          items:
            type: string
            enum:
              - rag.search
              - rag.read_document
        resource_documentation:
          type: string
          format: uri
      required:
        - resource
        - bearer_methods_supported
      additionalProperties: true
    JsonRpcRequest:
      type: object
      description: "JSON-RPC 2.0 요청(MCP Streamable HTTP). 도구: search, get_document, list_collections. 배치 요청은 MCP 2026-07-28 스펙에 따른다"
      properties:
        jsonrpc:
          type: string
          const: "2.0"
        id:
          type:
            - string
            - integer
            - "null"
        method:
          type: string
        params:
          type: object
          additionalProperties: true
      required:
        - jsonrpc
        - method
      additionalProperties: false
    JsonRpcResponse:
      type: object
      description: JSON-RPC 2.0 응답. 도구 실행 오류는 result.isError=true + ProblemDetails 투영(05 §8)
      properties:
        jsonrpc:
          type: string
          const: "2.0"
        id:
          type:
            - string
            - integer
            - "null"
        result:
          type: object
          additionalProperties: true
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
            data: {}
          required:
            - code
            - message
      required:
        - jsonrpc
        - id
      additionalProperties: false
    SseStream:
      type: string
      description: "text/event-stream 본문(01 §10, 07 §9.2). 프레임 = id: {event_id} · event: {type} · data: {CloudEventEnvelope JSON 1행} · 빈 줄. 첫 프레임 앞 retry: 3000, 15s 마다 주석 \": keepalive\". EventType 이 아닌 event 값(gap, answer.*)은 제어·API 프레임. answer 스트림의 id 는 정수(재생 불가)"
