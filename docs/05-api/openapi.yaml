                    latency_ms: 0
                  schemas:
                    status: ok
                    latency_ms: 0
      x-rag-rate-limit-class: public
      x-rag-idempotency: ignored
      x-rag-async: false
  "/metrics":
    get:
      tags:
        - system
      summary: Prometheus 메트릭(내부망 전용)
      operationId: get_metrics
      description: Prometheus 노출 형식(text/plain; version=0.0.4). 인그레스에 라우팅하지 않고 rag-observability 네임스페이스 스크레이프만 허용한다(01 §21.4). 01 §17.3 은 생성 OpenAPI 에서 이 경로를 제외하지만 바이블 §14 표면 완전성을 위해 여기 등재한다. tenant_id 라벨은 어떤 메트릭에도 없다(바이블 §6.5).
      security: []
      responses:
        "200":
          description: Prometheus 텍스트
          content:
            text/plain:
              schema:
                type: string
              example: |
                # HELP rag_query_latency_seconds Query latency
                # TYPE rag_query_latency_seconds histogram
                rag_query_latency_seconds_bucket{outcome="ok",le="0.5"} 1204
      x-rag-rate-limit-class: public
      x-rag-idempotency: ignored
      x-rag-async: false
  "/.well-known/oauth-protected-resource":
    get:
      tags:
        - mcp
      summary: OAuth 2.1 보호 자원 메타데이터(RFC 9728 PRM, 무인증)
      operationId: get_oauth_protected_resource_metadata
      description: "MCP 클라이언트가 인가 서버 위치를 발견하는 문서. resource = RAG_API__PUBLIC_BASE_URL, authorization_servers = RAG_MCP__AUTHORIZATION_SERVERS(빈 배열이면 API 키 모드 — 필드 생략), scopes_supported = rag.search, rag.read_document(Cedar 인가를 대체하지 않고 앞단에서 좁힌다). Cache-Control: public, max-age=300. 01 §17.3 은 생성 문서에서 제외하지만 표면 완전성을 위해 등재(05 §3.1)."
      security: []
      responses:
        "200":
          description: PRM JSON
          headers:
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectedResourceMetadata"
              example:
                resource: https://rag.example.go.kr
                authorization_servers:
                  - https://idp.example.go.kr/realms/rag
                bearer_methods_supported:
                  - header
                scopes_supported:
                  - rag.search
                  - rag.read_document
                resource_documentation: https://rag.example.go.kr/docs/mcp
      x-rag-rate-limit-class: public
      x-rag-idempotency: ignored
      x-rag-async: false
  # POST /mcp 는 바이블 §14 "/mcp" 행(MCP Streamable HTTP: search·get_document·list_collections)과 같은 연산이다.
  "/mcp":
    post:
      tags:
        - mcp
      summary: MCP Streamable HTTP(JSON-RPC 2.0) — search, get_document, list_collections
      operationId: mcp_rpc
      description: "MCP 스펙 2026-07-28(무상태) 단일 엔드포인트. Accept: application/json, text/event-stream 필수; 응답은 JSON 또는 요청 범위 SSE. GET·DELETE 는 405, Origin 검증 실패는 403. 도구 3종(D-13): search(query, collection_ids?, top_k?, filters?, response_format?, cursor?), get_document(document_id, view?, cursor?), list_collections(); v1.1 후보 search_batch, expand. 인증은 Authorization: Bearer(OIDC JWT 또는 API 키), 401 에 WWW-Authenticate: Bearer resource_metadata=\"…/.well-known/oauth-protected-resource\". 한도 클래스 query(헤더 없음 → ProblemDetails.retry_after 본문 사본). REST 자원 규약(§3·§7·§8)은 적용되지 않는다. 01 §17.3 은 생성 문서에서 제외하지만 표면 완전성을 위해 등재(05-mcp-server)."
      parameters:
        - name: Accept
          in: header
          required: true
          description: application/json, text/event-stream
          schema:
            type: string
          example: application/json, text/event-stream
        - name: MCP-Protocol-Version
          in: header
          required: false
          description: 협상된 프로토콜 버전(SDK 가 검증)
          schema:
            type: string
          example: "2026-07-28"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        description: JSON-RPC 2.0 요청(단건 또는 배치). 도구 인자 QueryRequest 인라인 한계 16KB
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonRpcRequest"
            example:
              jsonrpc: "2.0"
              id: 1
              method: tools/call
              params:
                name: search
                arguments:
                  query: 정보공개 결정 기한
                  collection_ids:
                    - 01J9ZQ5A1B2C3D4E5F6G7H8J9K
                  top_k: 5
                  response_format: concise
      responses:
        "200":
          description: JSON-RPC 응답(JSON) 또는 요청 범위 SSE
          headers:
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"
              example:
                jsonrpc: "2.0"
                id: 1
                result:
                  content:
                    - type: text
                      text: |-
                        [d1] 정보공개 업무 처리 규정 › 제9조 … (2026-02-15) [high]
                        청구를 받은 날부터 10일 이내에 공개 여부를 결정 …
                  structuredContent:
                    pack_id: 01JA0N6KDNGGJX60NRAF3CPCK2
                    items: 2
                    truncated: false
                    next_cursor: null
                  isError: false
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SseStream"
        "202":
          description: "알림(notification)·응답 전용 JSON-RPC 메시지 수신 — MCP Streamable HTTP 전송 계층 응답(본문·Location 없음). D-08 잡 접수 202 패턴(job_id·status_url·events_url)이 아니며 x-rag-async 는 false 다"
        "400":
          $ref: "#/components/responses/Problem"
          description: "요청 계약 위반(스키마·불변식·readOnly 필드·잘못된 커서·파라미터·Content-Type). code: contract.violation 등. 404·409(잡 상태)·410·412·413·415 는 전용 코드 채택 전 이 상태로 응답"
        "401":
          $ref: "#/components/responses/Problem"
          description: "미인증(auth.unauthenticated). WWW-Authenticate: Bearer realm=\"rag\""
        "403":
          $ref: "#/components/responses/Problem"
          description: "Origin 불일치 또는 insufficient_scope(WWW-Authenticate: Bearer error=\"insufficient_scope\", scope=\"rag.read_document\")"
        "429":
          $ref: "#/components/responses/Problem"
          description: 한도 초과(api.rate_limited). RateLimit·RateLimit-Policy·Retry-After 헤더
        "500":
          $ref: "#/components/responses/Problem"
          description: 결함·내부 계약 위반(contract.violation(산출물), fuse.k_missing 등)
        "503":
          $ref: "#/components/responses/Problem"
          description: 일시 불가(retrieve.unavailable, api.orchestrator_unavailable·api.dependency_unavailable 채택 전제). Retry-After(정수 초)
      x-rag-rate-limit-class: query
      x-rag-idempotency: ignored
      x-rag-async: false
      x-rag-authz-action: search
  "/v1/convert":
    servers:
      - url: http://parser-workers:8080
        description: parser-workers 사이드카(본 저장소 sidecars/; HWP→HWPX·DOCX 변환). 클러스터 내부, mTLS·NetworkPolicy. 포트는 배포 값 예시
      - url: http://ocr-gpu:8080
        description: ocr-gpu 사이드카(GPU OCR). 클러스터 내부
      - url: http://lo-sidecar:8080
        description: lo-sidecar(LibreOffice; 별도 저장소 rag-platform-gpl-sidecars, Helm optIn.*)
    post:
      tags:
        - sidecar
      summary: 사이드카 변환(ConvertRequest → ConvertResponse)
      operationId: convert_document
      description: 워커 → 변환 사이드카 호출(ADR-0033). 본문은 ArtifactRef 참조만(원본 바이트·base64 인라인 금지), 비밀은 credentials_ref 간접 참조. 사이드카는 input.uri 를 자기 자격 증명으로 읽고 파생물을 tenants/{tenant_id}/derived/ 아래 콘텐츠 주소화 저장한다. 변환 실패는 200 + output=null + error(StageError, stage=parse); ProblemDetails 는 전송·검증 오류(400 contract.violation, 503 parse.sidecar_unavailable)에만. deadline_ms 가 시간 한계 정본(HTTP 타임아웃 = deadline_ms + 5s). 인증은 mTLS(NetworkPolicy), 레이트 리밋 없음. traceparent 헤더와 본문 trace_id 둘 다 전파. 01 §17.3 은 별도 문서(sidecars/openapi.yaml)로 두지만 표면 완전성을 위해 여기 servers 오버라이드로 등재(16 §7).
      security:
        - mutualTLS: []
      parameters:
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/Tracestate"
      requestBody:
        required: true
        description: ConvertRequest
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConvertRequest"
            example:
              schema_version: 1.0.0
              input:
                uri: s3://rag-artifacts/tenants/01J9ZQ4K7X2M8N3P5R6S7T8V9W/sources/9f/9f3a7c1e5b2d4f6a8c0e2b4d6f8a1c3e5b7d9f1a3c5e7b9d1f3a5c7e9b1d3f5a
                blake3: 9f3a7c1e5b2d4f6a8c0e2b4d6f8a1c3e5b7d9f1a3c5e7b9d1f3a5c7e9b1d3f5a
                media_type: application/x-hwp
                size_bytes: 1843200
              options:
                target: hwpx
                keep_distribution_text: false
              tenant_id: 01J9ZQ4K7X2M8N3P5R6S7T8V9W
              document_id: 01J9ZQ5B2C3D4E5F6G7H8J9K0M
              deadline_ms: 840000
              trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
              credentials_ref: null
      responses:
        "200":
          description: 변환 결과(성공 또는 output=null + error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConvertResponse"
              example:
                schema_version: 1.0.0
                output:
                  uri: s3://rag-artifacts/tenants/01J9ZQ4K7X2M8N3P5R6S7T8V9W/derived/hwpx/4d/4d2e8b1a6c3f9e0d7b5a2c8e1f4a6d9b3e7c0a5d8f2b6e1c9a4d7f0b3e6c2a8d.hwpx
                  blake3: 4d2e8b1a6c3f9e0d7b5a2c8e1f4a6d9b3e7c0a5d8f2b6e1c9a4d7f0b3e6c2a8d
                  media_type: application/hwp+zip
                  size_bytes: 2211840
                derived:
                  - uri: s3://rag-artifacts/tenants/01J9ZQ4K7X2M8N3P5R6S7T8V9W/derived/conversion_report/95/9513ccffa6ba08633a2e798691d2b6eb1654757fb5036aff0cecaccf7276eb81.json
                    blake3: 9513ccffa6ba08633a2e798691d2b6eb1654757fb5036aff0cecaccf7276eb81
                    media_type: application/json
                    size_bytes: 2048
                warnings: []
                error: null
                took_ms: 1930
                producer:
                  plugin_id: parser.hwp5_java_sidecar
                  plugin_version: 0.1.0
                  config_hash: a1b2c3d4e5f60718293a4b5c6d7e8f900f1e2d3c4b5a69788796a5b4c3d2e1f0
                  image_digest: sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
                  model_ids: []
        "400":
          $ref: "#/components/responses/Problem"
          description: contract.violation(스키마·contracts_compat 범위 밖·비밀 평문·인라인 바이트)
        "503":
          $ref: "#/components/responses/Problem"
          description: parse.sidecar_unavailable(사이드카 준비 안 됨·과부하). Retry-After
      x-rag-rate-limit-class: public
      x-rag-idempotency: ignored
      x-rag-async: false
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Authorization: Bearer <credential>(RFC 6750) 한 헤더로 OIDC 액세스 토큰(JWT; JWKS 서명 + iss·aud·exp·nbf 검증, 주체 user:{sub} | service:{client_id})과 API 키(접두 rag_ak_ + base64url 43자, 주체 service:{client_id}) 모두 전달한다. 형식(JWS 점 2개 vs rag_ak_ 접두)으로 분기. 전용 헤더·쿼리 토큰·쿠키 없음. 401 은 WWW-Authenticate: Bearer realm=\"rag\", error=\"invalid_token\"(01 §5.1). MCP 스코프 rag.search, rag.read_document 는 Cedar 인가 앞단에서만 좁힌다"
    mutualTLS:
      type: mutualTLS
      description: 서비스 간 mTLS(메시 또는 SPIFFE). 주체 service:{client_id}(인증서 SAN 의 SPIFFE ID 또는 CN 에서 유도). 사이드카 POST /v1/convert 는 mTLS + NetworkPolicy 만(01 §5.1, 16 §7)
  parameters:
    cursor:
      name: cursor
      in: query
      required: false
      description: 이전 응답의 next_cursor 그대로(불투명 키셋 커서, 테넌트 바인딩 HMAC). 변조·필터 불일치는 400 contract.violation(detail="cursor invalid"; api.cursor_invalid 채택 후 그 코드)(01 §7.2)
      schema:
        type: string
        maxLength: 512
    limit:
      name: limit
      in: query
      required: false
      description: 페이지 크기 1..200(초안 목표). 기본 50. 초과는 400(01 §7.1)
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    sort:
      name: sort
      in: query
      required: false
      description: 정렬 {field}(오름차순) 또는 -{field}(내림차순). 허용 필드는 엔드포인트별 화이트리스트(기본 created_at, updated_at). 다중 정렬 없음(01 §7.1)
      schema:
        type: string
        default: "-created_at"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 멱등 키(가시 ASCII 1..255, UUID v4 권장). 스코프 (tenant_id, key), 보존 24h(초안). POST /v1/ingest·/v1/ingest/batch 필수, 잡 접수형 POST·DELETE 선택, 그 외 무시(01 §6; x-rag-idempotency)
      schema:
        type: string
        pattern: ^[\x21-\x7E]{1,255}$
      example: a3f1c9d2-7b4e-4c8a-9e1f-2d3c4b5a6f70
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: 필수 멱등 키(D-08). 부재 → 400 contract.violation(api.idempotency_key_required 채택 후 그 코드). 같은 키·같은 본문 → 200 재생, 처리 중 → 409 api.idempotency_conflict, 다른 본문 → 422 api.idempotency_payload_mismatch(01 §6)
      schema:
        type: string
        pattern: ^[\x21-\x7E]{1,255}$
      example: d2c5f1a8-6b3e-4e9a-a1c7-5f0b2d9e8c41
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: 낙관적 동시성(PATCH·PUT·DELETE). ETag 불일치는 412 전용 코드(api.precondition_failed) 채택 전 400 contract.violation(01 §3.4)
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: 조건부 GET. ETag 일치 시 304(GET /v1/jobs/{job_id}, GET /v1/schemas/{name}, GET /v1/documents/{document_id})
      schema:
        type: string
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: "SSE 재접속 커서(마지막 수신 id = event_id). 발행 순 커서로 재생(7일 창, 초안). 창 밖이면 event: gap 제어 프레임(07 §9.3)"
      schema:
        $ref: "#/components/schemas/Ulid"
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C Trace Context. 유효하면 trace-id 를 이어받는다(sampled 플래그는 서버 정책). 형식 오류는 무시(400 아님)(01 §14)
      schema:
        type: string
        pattern: ^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
      example: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
    Tracestate:
      name: tracestate
      in: header
      required: false
      description: W3C tracestate. 수정 없이 전파(512바이트 초과는 절단)(01 §14)
      schema:
        type: string
        maxLength: 512
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: ProblemDetails.title 지역화(ko | en). 기본 en(01 §12.4)
      schema:
        type: string
      example: ko, en;q=0.5
    job_id:
      name: job_id
      in: path
      required: true
      description: 잡 ID(ULID 대문자, = Temporal 워크플로우 ID). 다른 테넌트·부재 ID는 403(존재 비노출)
      schema:
        $ref: "#/components/schemas/Ulid"
    document_id:
      name: document_id
      in: path
      required: true
      description: 문서 ID(ULID). 테넌트 안에서만 해석
      schema:
        $ref: "#/components/schemas/Ulid"
    collection_id:
      name: collection_id
      in: path
      required: true
      description: 컬렉션 ID(ULID)
      schema:
        $ref: "#/components/schemas/Ulid"
    profile_id:
      name: profile_id
      in: path
      required: true
      description: 프로파일 ID(kebab-case, 예 korean-gov)
      schema:
        type: string
        pattern: ^[a-z][a-z0-9-]*$
        maxLength: 64
    tenant_id:
      name: tenant_id
      in: path
      required: true
      description: 테넌트 ID(ULID). 토큰의 tenant_id 와 같아야 한다(불일치 403 auth.forbidden, 01 §3.2)
      schema:
        $ref: "#/components/schemas/Ulid"
    subscription_id:
      name: subscription_id
      in: path
      required: true
      description: 웹훅 구독 ID(ULID)
      schema:
        $ref: "#/components/schemas/Ulid"
    run_id:
      name: run_id
      in: path
      required: true
      description: 평가 런 ID(ULID)
      schema:
        $ref: "#/components/schemas/Ulid"
    schema_name:
      name: name
      in: path
      required: true
      description: 스키마 kebab-name(예 context-pack). PascalCase·미등록 이름은 404 규칙(api.not_found 채택 전 400 contract.violation, 01 §9.2)
      schema:
        type: string
        pattern: ^[a-z][a-z0-9-]*$
      example: context-pack
  headers:
    RateLimit:
      description: "현재 한도 상태(draft-ietf-httpapi-ratelimit-headers-11 구조화 필드). 모든 인증 응답에 포함. 예: \"query\";r=37;t=1"
      schema:
        type: string
      example: "\"query\";r=37;t=1"
    RateLimit-Policy:
      description: "한도 정책(클래스 이름 = 정책 이름). 예: \"query\";q=50;w=1"
      schema:
        type: string
      example: "\"query\";q=50;w=1"
    Retry-After:
      description: 재시도 대기 초(정수). 429·503·409(멱등 충돌)에 포함
      schema:
        type: integer
        minimum: 0
      example: 1
    Location:
      description: 생성 자원 또는 잡 상태 자원(status_url)의 절대 URL(01 §8)
      schema:
        type: string
        format: uri
      example: https://rag.example.go.kr/v1/jobs/01JAC0A1B2C3D4E5F6G7H8J9K0
    ETag:
      description: 강한 검증자. 자원 updated_at 또는 본문 BLAKE3 앞 16 hex(01 §3.4)
      schema:
        type: string
      example: "\"3c9a0d1e2f4b5a6c\""
    Last-Modified:
      description: HTTP-date. 공개 스키마 게시 응답(01 §12.3)
      schema:
        type: string
    Cache-Control:
      description: 인증 응답 no-store; 공개 표면은 public, max-age=3600(스키마) / 300(PRM)(01 §12.3)
      schema:
        type: string
      example: no-store
    Deprecation:
      description: "RFC 9745 폐기 표기(구조화 필드 Date @{unix}). deprecated: true 연산에서만 x-rag-deprecated-at 로부터 자동 부착(01 §16)"
      schema:
        type: string
      example: "@1790812800"
    Sunset:
      description: RFC 8594 종료 시각(HTTP-date). Deprecation 과 함께만 전송(01 §16)
      schema:
        type: string
      example: Tue, 30 Mar 2027 00:00:00 GMT
    Link:
      description: RFC 8288 링크. rel="related"(유발된 잡·생성된 런), rel="deprecation", rel="successor-version"
      schema:
        type: string
      example: <https://rag.example.go.kr/v1/jobs/01JAC0A1B2C3D4E5F6G7H8J9K0>; rel="related"
    Content-Language:
      description: "ProblemDetails.title 의 언어(en 기본, Accept-Language: ko 이면 ko). 오류 응답에만(01 §12.4)"
      schema:
        type: string
        enum:
          - en
          - ko
    WWW-Authenticate:
      description: "RFC 6750. 401 응답: Bearer realm=\"rag\", error=\"invalid_token\"(토큰 부재는 error 생략); MCP 는 resource_metadata 병기"
      schema:
        type: string
      example: Bearer realm="rag", error="invalid_token"
  responses:
    Problem:
      description: "오류 응답(RFC 9457). 모든 4xx·5xx 는 이 응답 하나를 참조하고 상태별로 description 만 다르다(01 §9.1·§17.2). type = urn:rag:error:{code}, code·retryable·trace_id 필수. 클라이언트 분기는 status 가 아니라 code. 카탈로그에 전용 코드가 없는 404·409(잡 상태)·410·412·413·415 는 채택 전까지 400 contract.violation + detail 첫 토큰(예 \"not found: …\")으로 응답한다(01 §9.2)"
      headers:
        RateLimit:
          $ref: "#/components/headers/RateLimit"
        RateLimit-Policy:
          $ref: "#/components/headers/RateLimit-Policy"
        Retry-After:
          $ref: "#/components/headers/Retry-After"
        WWW-Authenticate:
          $ref: "#/components/headers/WWW-Authenticate"
        Content-Language:
          $ref: "#/components/headers/Content-Language"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            contractViolation:
              summary: 400 contract.violation(요청 검증)
              value:
                type: urn:rag:error:contract.violation
                title: Contract violation
                status: 400
                detail: request body failed schema validation (2 errors)
                instance: /v1/ingest
                code: contract.violation
                retryable: false
                trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
                request_id: 01JAC0A2M3N4P5Q6R7S8T9V0W1
                errors:
                  - code: contract.violation
                    type: urn:rag:error:contract.violation
                    retryable: false
                    stage: api
                    location:
                      pointer: /acl/visibility
                  - code: contract.violation
                    type: urn:rag:error:contract.violation
                    retryable: false
                    stage: api
                    location:
                      pointer: /requested_at
            unauthenticated:
              summary: 401 auth.unauthenticated
              value:
                type: urn:rag:error:auth.unauthenticated
                title: Unauthenticated
                status: 401
                detail: bearer token missing or invalid
                instance: /v1/query
                code: auth.unauthenticated
                retryable: false
                trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
            forbidden:
              summary: 403 auth.forbidden(존재 비노출)
              value:
                type: urn:rag:error:auth.forbidden
                title: Forbidden
                status: 403
                detail: action read_document denied
                instance: /v1/documents/01JAC09Z8Y7X6W5V4T3S2R1Q0P
                code: auth.forbidden
                retryable: false
                trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
            idempotencyConflict:
              summary: 409 api.idempotency_conflict
              value:
                type: urn:rag:error:api.idempotency_conflict
                title: Idempotency conflict
                status: 409
                detail: a request with the same Idempotency-Key is still being accepted; poll the instance job instead of resending
                instance: /v1/jobs/01JAC0A1B2C3D4E5F6G7H8J9K0
                code: api.idempotency_conflict
                retryable: false
                trace_id: 7d3a1f0c9b8e4a2d6c5f1e0b9a8d7c6f
                request_id: 01JAC0A2M3N4P5Q6R7S8T9V0W1
            rateLimited:
              summary: 429 api.rate_limited
              value:
                type: urn:rag:error:api.rate_limited
                title: Rate limited
                status: 429
                detail: tenant quota for class query exhausted; window resets in 1 second
                instance: /v1/query
                code: api.rate_limited
                retryable: false
                trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
                retry_after: 1
                request_id: 01JA0R9X2K7M4N6P8Q1S3T5V7W
            retrieveUnavailable:
              summary: 503 retrieve.unavailable(전 채널 실패)
              value:
                type: urn:rag:error:retrieve.unavailable
                title: Retrieval unavailable
                status: 503
                detail: all retrieval channels failed
                instance: /v1/query
                code: retrieve.unavailable
                retryable: true
                trace_id: 6cdaea08023520fbf5462d7fab30e7c2
                retry_after: 5
                errors:
                  - code: retrieve.channel_timeout
                    type: urn:rag:error:retrieve.channel_timeout
                    retryable: true
                    stage: retrieve
                    plugin_id: retriever.dense
                  - code: retrieve.backend_error
                    type: urn:rag:error:retrieve.backend_error
                    retryable: true
                    stage: retrieve
                    plugin_id: retriever.lexical
