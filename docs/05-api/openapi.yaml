      operationId: get_schema
      description: "배포 빌드의 schemas/{name}.schema.json 바이트 그대로(현재 major 의 최신 minor·patch). 무인증 공개(테넌트 데이터 없음). ETag(BLAKE3 앞 16 hex) + If-None-Match → 304, Last-Modified, Cache-Control: public, max-age=3600. 이전 major 는 ?major= 로 폐기 창(180일 또는 2 minor 중 긴 것) 동안 게시, 종료 후 404. 한도 클래스 public(클라이언트 IP)(01 §12.3, 04 §6)."
