          description: 이전 major 조회(폐기 창 내)
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/Tracestate"
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: JSON Schema 2020-12 문서
          headers:
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
            Deprecation:
              $ref: "#/components/headers/Deprecation"
            Sunset:
              $ref: "#/components/headers/Sunset"
            ETag:
              $ref: "#/components/headers/ETag"
            Last-Modified:
              $ref: "#/components/headers/Last-Modified"
          content:
            application/schema+json:
              schema:
                type: object
                description: JSON Schema 2020-12 문서($id = urn:rag:schema:{name}:{major})
                additionalProperties: true
              example:
                $schema: https://json-schema.org/draft/2020-12/schema
                $id: urn:rag:schema:problem-details:1
                title: ProblemDetails
                description: RFC 9457 Problem Details 응답 본문(application/problem+json). 이 파일은 인벤토리 게시용 $ref 래퍼다.
                $ref: urn:rag:schema:common-types:1#/$defs/ProblemDetails
