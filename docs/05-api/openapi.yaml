    RenderRequest:
      type: object
      description: POST /v1/render 본문(03 §4.1). pack_id 와 context_pack 중 정확히 하나
      properties:
        pack_id:
          $ref: "#/components/schemas/Ulid"
          description: POST /v1/query 가 돌려준 context_pack.pack_id(조회 창 10분, 주체 바인딩 대조)
        context_pack:
          $ref: "#/components/schemas/ContextPack"
          description: 클라이언트가 보관한 팩 전문(≤ 512KB). 인라인 팩은 ACL 재검증 없음
        renderer:
          $ref: "#/components/schemas/Renderer"
        options:
          $ref: "#/components/schemas/RenderOptions"
      required:
        - renderer
      oneOf:
        - required:
            - pack_id
        - required:
            - context_pack
      additionalProperties: false
    RenderOptions:
      type: object
      description: 렌더 옵션 9키(03 §4.2). options_hash 는 기본값을 채운 객체의 H("config", …)
      properties:
        query_text:
          type: string
          minLength: 1
          maxLength: 4000
          description: 팩 뒤에 놓을 질의 텍스트 블록. 없으면 질의 블록 생략
        tool_result:
          type: boolean
          default: false
          description: "anthropic_search_result: tool_result 경로"
        tool_use_id:
          type: string
          description: tool_result=true 면 필수
        include_instructions:
          type: boolean
          default: true
          description: false 면 stable_prefix = null
        cache_control:
          type: boolean
          default: true
          description: "anthropic_*: 접두어 끝·팩 끝 ephemeral 브레이크포인트"
        structured_output:
          type: boolean
          default: false
          description: citation_style=native 와 병용 시 400 render.citations_with_structured_output
        empty_policy:
          type: string
          enum:
            - placeholder
            - error
          default: placeholder
          description: K=0 팩 처리
        response_format:
          $ref: "#/components/schemas/ResponseFormat"
          description: mcp_tool_result 전용(concise | detailed). pack_only 는 이 엔드포인트에서 400
        max_result_tokens:
          type: integer
          minimum: 1000
          maximum: 20000
          default: 20000
          description: mcp_tool_result 전용
      dependentRequired:
        tool_use_id:
          - tool_result
      additionalProperties: false
    AnswerRequest:
      type: object
      description: POST /v1/answer 본문(03 §5.2, 레퍼런스 구현). query_request 와 pack_id 중 정확히 하나
      properties:
        schema_version:
          $ref: "#/components/schemas/Semver"
        query_request:
          $ref: "#/components/schemas/QueryRequest"
          description: renderer 는 anthropic_search_result | anthropic_document 만, target_model.provider=anthropic
        pack_id:
          $ref: "#/components/schemas/Ulid"
          description: 조회 창의 팩. budget.tokenizer.provider != anthropic 이면 422 pack.tokenizer_mismatch
        question:
          type: string
          minLength: 1
          maxLength: 4000
          description: pack_id 경로에서 필수(팩에 질의 원문이 없다)
        citation_style:
          $ref: "#/components/schemas/CitationStyle"
          description: 생략 시 팩 render_hints.citation_style. native 는 output_schema 와 병용 불가
        output_schema:
          type: object
          description: 답변 JSON Schema(2020-12) — 공급자 구조화 출력으로 전달
        max_answer_tokens:
          type: integer
          minimum: 1
          description: 기본·상한 = 팩 reserved_answer_tokens
        stream:
          type: boolean
          default: false
          description: "true 면 text/event-stream(Accept: text/event-stream 도 같은 의미)"
        include_pack:
          type: boolean
          default: false
          description: true 면 응답에 context_pack 포함(스트림은 answer.pack 프레임 1건)
        requested_at:
          $ref: "#/components/schemas/DateTime"
      required:
        - schema_version
        - requested_at
      oneOf:
        - required:
            - query_request
        - required:
            - pack_id
            - question
      additionalProperties: false
