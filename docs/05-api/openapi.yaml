        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileValidateRequest"
            example:
              yaml: |
                schema_version: "1.0.0"
                profile_id: standard-ko-hybrid
                version: "1.2.0"
                extends: standard
                tier: standard
                query:
                  fusion:
                    method: convex_minmax
      responses:
        "200":
          description: 검증 성공
          headers:
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimit-Policy"
            Deprecation:
              $ref: "#/components/headers/Deprecation"
            Sunset:
              $ref: "#/components/headers/Sunset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileValidationResult"
              example:
                schema_type: ProfileValidationResult
                valid: true
                profile_id: standard-ko-hybrid
                version: 1.2.0
                extends: standard
                profile_hash: 9f3a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a
                embedding_profile_hash: d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5
                analyzer_id: mecab-ko:1.3.7:ko-dic-2.1.1
                warnings:
                  - code: profile.gate_pending
                    message: query.fusion.method=convex_minmax requires gate min_qrels=200 on eval.datasets[0]; gate result not yet recorded
                    pointer: /query/fusion/method
                auto_degraded:
                  - component: channel.late_interaction
                    reason: capability_unsupported
                    detail: index_backend.qdrant supports_multivector=true but embedder declares no late_interaction vector
                plugins_resolved:
                  - plugin_id: embedder.vllm_pooling_bge_m3
