# RAG Platform API — OpenAPI 3.1.0
# 정본: docs/02-architecture/00-design-bible.md §14(API 표면, 1.3.0 기준), docs/05-api/01~04·07(계약·규약).
# components.schemas 의 각 항목이 schemas/*.schema.json 을 상대 경로 $ref 하나로 잇고, 문서 안의 다른 모든 참조는 #/components/schemas/{Type} 이다(정본은 계약, 이 문서는 파생물 — D-05, 01 §17.2).
# 생성 산출물: rag openapi export --out docs/05-api/openapi.yaml(제안). 손으로 편집한 내용은 재생성 시 덮어쓴다.
openapi: 3.1.0
info:
  title: RAG Platform API
  version: 0.1.1
  summary: 문서 수집·검색·컨텍스트 패킹·관리 평면·이벤트를 제공하는 멀티테넌트 RAG 플랫폼 API(/v1)
  description: |-
    RAG 플랫폼 공개 API 표면(바이블 §14 정본, 1.3.0 기준; /v1, JSON, RFC 9457, Idempotency-Key, RateLimit). 한 ASGI 앱이 REST·SSE·MCP 를 제공하고 인증(Authorization: Bearer — OIDC JWT 또는 API 키 rag_ak_…; 서비스 간은 mTLS)·Cedar 인가·레이트 리밋·멱등성·RFC 9457 변환은 단일 미들웨어 체인이 수행한다.

    핵심 규약(docs/05-api/01-api-design-guidelines.md):
    - 테넌트 스코프는 자격 증명에서만 도출한다. 요청 본문·경로·쿼리의 tenant_id·SecurityContext 하위 키는 거부된다(400 contract.violation; auth.tenant_mismatch 채택 후 422).
    - 응답 본문은 계약 인스턴스 그대로다(schema_version·schema_type 봉투 포함). 래퍼는 목록 {items, next_cursor}, 잡 접수(IngestAccepted | JobStatus), 검색 응답 QueryResponse 셋뿐이다.
    - 모든 4xx·5xx 는 application/problem+json ProblemDetails(type = urn:rag:error:{code}, code·retryable·trace_id 필수)이며 클라이언트 분기는 code 로 한다. 전용 코드가 없는 404·409(잡 상태)·410·412·413·415 는 채택 전까지 400 contract.violation + detail 첫 토큰으로 응답한다.
    - 시간이 걸리는 모든 작업은 "202 + Location + 상태 자원(GET /v1/jobs/{job_id}) + SSE + 웹훅" 한 패턴이다. 202 본문에는 항상 job_id·status_url·events_url 이 있다(D-08). 유일한 예외는 /mcp — JSON-RPC 알림·응답 전용 메시지 수신에 대한 MCP Streamable HTTP 전송 계층의 202(본문·Location 없음, x-rag-async false)로, 잡 접수 패턴이 아니다.
    - 목록은 불투명 커서(cursor·limit·sort)이며 총 개수는 없다. 미지 쿼리 파라미터는 400.
    - 모든 인증 응답에 RateLimit·RateLimit-Policy 헤더(draft-ietf-httpapi-ratelimit-headers-11), 초과 시 429 api.rate_limited + Retry-After. 한도 클래스는 연산의 x-rag-rate-limit-class.
    - 폐기는 deprecated: true + x-rag-deprecated-at·x-rag-sunset 에서 Deprecation·Sunset·Link 헤더를 자동 부착한다(01 §16).
    - 요청·응답 스키마의 정본은 schemas/*.schema.json(JSON Schema 2020-12, $id = urn:rag:schema:{kebab}:{major})이고 이 문서는 파생물이다(D-05). components.schemas 의 각 항목이 상대 경로 $ref 하나로 계약을 잇고(x-rag-schema-id 가 동치 검사의 대조 키), 경로·파라미터·인라인 DTO 등 문서 안의 다른 모든 참조는 #/components/schemas/{Type} 이다(01 §17.2) — 단독 게시(GET /v1/openapi.json, 제안)에서도 참조가 깨지지 않는다.

    확장 필드: x-rag-rate-limit-class(query | ingest | admin | public), x-rag-idempotency(required | optional | ignored), x-rag-async(202 잡 접수형), x-rag-authz-action(Cedar 액션; 공개 표면 제외), x-rag-schema-id, x-rag-pending(string[]; 연산이 의존하는 채택 전 제안 — 바이블 §5.7 열거값·오류 코드, §14 minor 발의. 채택 전 서버 동작과 예시 대안은 해당 description 에 적고, 예시는 항상 현재 스키마로 검증 가능해야 한다).

    표면 범위: 바이블 §14 의 모든 경로·메서드. 01 §17.3 이 생성 문서에서 제외하는 /metrics, /.well-known/oauth-protected-resource 와 별도 문서로 두는 사이드카 POST /v1/convert 도 표면 완전성을 위해 등재했다(사이드카는 sidecar 태그 + servers 오버라이드). POST /mcp(mcp 태그, operationId mcp_rpc)는 바이블 §14 "/mcp" 행과 같은 연산이다 — MCP Streamable HTTP 전송 계층 하나이며 REST 잡 접수 패턴이 아니다(x-rag-async false). 1.3.0(AM-39)이 바이블 §14 에 추가한 경로 — GET/POST /v1/tenants, GET/PATCH /v1/tenants/{tenant_id}, GET /v1/tenants/{tenant_id}/policies, GET/POST /v1/api-keys, DELETE /v1/api-keys/{api_key_id}, POST /v1/api-keys/{api_key_id}/rotate, GET /v1/plugins·/v1/plugins/{plugin_id}, GET /v1/audit-events, GET /v1/schemas, GET /v1/version, POST /v1/profiles, POST /v1/collections/{collection_id}/consistency-check, POST /v1/documents/{document_id}/unmask — 를 이번 개정에서 등재했다. 04·07 문서의 "제안" 엔드포인트 중 바이블 §14 에 여전히 없는 것(GET /v1/plugins/{plugin_id}/capabilities·.../health, GET/PUT /v1/tenants/{tenant_id}/dictionary, /v1/capacity, /v1/subscriptions/{id}/test·/rotate-secret·/redeliver·/deliveries 등)은 바이블 §14 minor 발의 전이라 포함하지 않았다. GET /v1/subscriptions/{subscription_id}(get_subscription) 는 바이블 §14 행(GET/POST/DELETE /v1/subscriptions · /v1/subscriptions/{subscription_id})에 따라 등재했으며 01 §9.3 표에는 아직 없다(01 갱신 대상). A10 감사(바이블 §14 ↔ 이 문서)가 표기한 DELETE /v1/subscriptions, POST /v1/subscriptions/{subscription_id}, POST /v1/eval/runs/{run_id}, POST /v1/eval/runs/{run_id}/report "누락"은 실제 누락이 아니다 — 바이블 §14 행의 "GET/POST/DELETE" 결합 표기를 감사기가 경로마다 곱해 생긴 조합이며(각 경로는 의미 있는 조합만 구현: GET+POST /v1/subscriptions, GET+DELETE /v1/subscriptions/{subscription_id}, POST /v1/eval/runs, GET /v1/eval/runs/{run_id}·.../report), A10 파서 수정은 5단계로 넘긴다(12-appendix/08 §2 openapi.yaml 절). 상태 코드는 01 §9.2 를 따른다 — 전용 코드가 미채택인 404·409(잡 상태)·410·412·413·415 는 응답으로 선언하지 않고 각 연산의 400 description 에 적는다(채택 시 응답 추가).
  termsOfService: https://rag.example.go.kr/docs/terms
  contact:
    name: RAG Platform API 소유팀
    url: https://rag.example.go.kr/docs
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  x-rag-contracts-compat: ">=1.0,<2.0"
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
externalDocs:
  description: 설계 바이블 §14 API 표면 정본 및 05-api 계약 문서
  url: https://rag.example.go.kr/docs/05-api/01-api-design-guidelines.md
# servers 는 비운다(01 §17.5 — 상대 경로; 배포 URL 은 문서 소비자가 RAG_API__PUBLIC_BASE_URL 로 채운다). 예시의 status_url·events_url·Location 절대 URL 은 https://rag.example.go.kr 기준이다.
# lite 개발 모드(rag up --profile lite)는 http://localhost:8000 에서 /docs·/redoc 을 함께 켠다. 사이드카 POST /v1/convert 만 경로 수준 servers 오버라이드를 가진다.
servers: []
security:
  - bearerAuth: []
  - mutualTLS: []
tags:
  - name: ingest
    description: 문서 수집 접수 — POST /v1/ingest, /v1/ingest/batch(Idempotency-Key 필수, 202 IngestAccepted)
  - name: jobs
    description: 잡 조회·제어·이벤트 스트림 — /v1/jobs*(JobStatus 읽기 모델, SSE)
  - name: documents
    description: 문서 자원 — 메타·산출물 열람·커밋 이력·ACL·메타 갱신·재처리·삭제·PII 원문 복원(unmask, 1.3.0 AM-39, pii_officer 전용)
  - name: retrieval
    description: 검색 경로 — POST /v1/query(QueryResponse), /v1/render(RenderedContext), /v1/answer(레퍼런스 구현)
  - name: feedback
    description: 온라인 피드백 — POST /v1/feedback(FeedbackEvent)
  - name: collections
    description: 컬렉션 관리 — CollectionSpec, 재색인(blue/green), 통계, 사용자 사전, 정합성 검사(consistency-check, 1.3.0 AM-39)
  - name: profiles
    description: 프로파일 레지스트리 — 조회(해소 결과)·YAML 검증
  - name: tenants
    description: 테넌트 자원 — 목록·생성·조회·변경(status·quotas, 1.3.0 AM-39, 플랫폼 관리자), 계량(usage_ledger)·정책(경로 tenant_id = 토큰 tenant_id)
  - name: api-keys
    description: API 키 레지스트리 — 목록·발급·폐기·회전(1.3.0 AM-39, service 주체 호출 금지)
  - name: plugins
    description: 설치된 플러그인 레지스트리 — 목록·상세(PluginMeta, 1.3.0 AM-39)
  - name: audit
    description: 감사 이벤트 조회 — GET /v1/audit-events(1.3.0 AM-39, read_audit)
  - name: subscriptions
    description: 웹훅 구독 — HTTPS + RAG-Signature 전달, EgressPolicy 판정
  - name: events
    description: 테넌트 스코프 SSE 스트림(CloudEvents) — GET /v1/events
  - name: eval
    description: 평가 하네스 — 데이터셋·런·리포트(/v1/eval/*)
  - name: schemas
    description: JSON Schema 게시 — 목록(무인증, 1.3.0 AM-39)·개별 스키마(무인증, application/schema+json)
  - name: system
    description: 상태·버전 — /healthz, /readyz(무인증), /metrics(내부망), GET /v1/version(1.3.0 AM-39, read_registry)
  - name: mcp
    description: MCP Streamable HTTP(/mcp, JSON-RPC 2.0) 와 RFC 9728 PRM(/.well-known/oauth-protected-resource)
  - name: sidecar
    description: 변환 사이드카(parser-workers·ocr-gpu·lo-sidecar) — POST /v1/convert, GET /healthz. 별도 servers(클러스터 내부, mTLS). 정식 문서는 sidecars/openapi.yaml(01 §17.3)
paths:
  "/v1/ingest":
    post:
      tags:
        - ingest
      summary: 문서 수집 접수(IngestRequest → 202)
      operationId: ingest_document
      description: IngestRequest 한 건을 접수해 ingest.document.v1 잡을 만든다(D-08). Idempotency-Key 필수 — 같은 키·같은 본문(바이트 동일, requested_at 포함) 재전송은 200 + 원 응답 본문, 처리 중은 409, 다른 본문은 422. 본문 64KB(metadata 16KB). tenant_id·request_id 는 본문에 오면 거부. 같은 document_id 의 활성 잡이 있으면 queued(waiting_for)로 접수된다(02 §4).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/Tracestate"
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        description: IngestRequest(클라이언트 본문; request_id 없음)
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestRequest"
            example:
              schema_version: 1.0.0
              collection_id: 01J9ZQ5A1B2C3D4E5F6G7H8J9K
              source_uri: s3://mois-records/regulations/2026/records-management-rule-2026-09.hwpx
              media_type_hint: application/hwp+zip
              external_id: MOIS-REG-2026-0917
              metadata:
                title: 공공기록물 관리에 관한 법률 시행규칙 일부개정안
                doc_date: "2026-09-17"
                doc_type: regulation
                department: 행정안전부
                language_hint: ko
                tags:
                  - 기록물
                  - 시행규칙
                  - 개정안
                genre: law_article
              acl:
                allow_principals:
                  - group:mois_records
                visibility: restricted
                classification: internal
                embargo_until: "2026-10-01T00:00:00.000Z"
              pii_policy: mask
              dedup_policy: skip_if_same_hash
              priority: 5
              callback:
                webhook_url: https://hooks.example.go.kr/rag/ingest
                events:
                  - job.state.changed
                  - ingest.document.indexed
                  - ingest.document.failed
              requested_at: "2026-09-23T01:00:00.000Z"
      responses:
        "200":
          description: 멱등 재생(같은 키·같은 지문, 접수 커밋 후). 원 202 응답과 내용 동일
          headers:
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimit-Policy"
            Deprecation:
              $ref: "#/components/headers/Deprecation"
            Sunset:
              $ref: "#/components/headers/Sunset"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestAccepted"
              example:
                job_id: 01JAC0A1B2C3D4E5F6G7H8J9K0
                request_id: 01JAC0A0Z9Y8X7W6V5T4S3R2Q1
                document_id: 01JAC09Z8Y7X6W5V4T3S2R1Q0P
                status_url: https://rag.example.go.kr/v1/jobs/01JAC0A1B2C3D4E5F6G7H8J9K0
                events_url: https://rag.example.go.kr/v1/jobs/01JAC0A1B2C3D4E5F6G7H8J9K0/events
        "202":
          description: 접수. Location = status_url
          headers:
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimit-Policy"
            Deprecation:
              $ref: "#/components/headers/Deprecation"
            Sunset:
              $ref: "#/components/headers/Sunset"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestAccepted"
              example:
                job_id: 01JAC0A1B2C3D4E5F6G7H8J9K0
                request_id: 01JAC0A0Z9Y8X7W6V5T4S3R2Q1
                document_id: 01JAC09Z8Y7X6W5V4T3S2R1Q0P
                status_url: https://rag.example.go.kr/v1/jobs/01JAC0A1B2C3D4E5F6G7H8J9K0
                events_url: https://rag.example.go.kr/v1/jobs/01JAC0A1B2C3D4E5F6G7H8J9K0/events
        "400":
          $ref: "#/components/responses/Problem"
          description: "요청 계약 위반(스키마·불변식·readOnly 필드·잘못된 커서·파라미터·Content-Type). code: contract.violation 등. 404·409(잡 상태)·410·412·413·415 는 전용 코드 채택 전 이 상태로 응답"
        "401":
          $ref: "#/components/responses/Problem"
          description: "미인증(auth.unauthenticated). WWW-Authenticate: Bearer realm=\"rag\""
        "403":
          $ref: "#/components/responses/Problem"
          description: 인가 거부·존재 비노출(auth.forbidden, plan.collection_forbidden). 재시도 금지
        "409":
          $ref: "#/components/responses/Problem"
          description: "멱등 키 처리 중(api.idempotency_conflict; instance = 기존 잡, Retry-After: 1)"
        "422":
          $ref: "#/components/responses/Problem"
          description: 의미 검증 실패(api.idempotency_payload_mismatch, auth.too_many_principals, profile.invalid, plugin.license_denied, plugin.capability_unsupported, plan.filter_field_forbidden, pack.tokenizer_mismatch, outbox.egress_denied)
        "429":
          $ref: "#/components/responses/Problem"
          description: 한도 초과(api.rate_limited). RateLimit·RateLimit-Policy·Retry-After 헤더
        "500":
          $ref: "#/components/responses/Problem"
          description: 결함·내부 계약 위반(contract.violation(산출물), fuse.k_missing 등)
        "503":
          $ref: "#/components/responses/Problem"
          description: "(a) 오케스트레이터 불가 — 접수 커밋됨, 잡 queued, 재전송은 200 / (b) 산출물 저장 불가 — 접수 없음. Retry-After: 30"
      x-rag-rate-limit-class: ingest
      x-rag-idempotency: required
      x-rag-async: true
      x-rag-authz-action: ingest
  "/v1/ingest/batch":
    post:
      tags:
        - ingest
      summary: 문서 수집 배치 접수(IngestRequest[] 1..100 → 202)
      operationId: ingest_documents_batch
      description: IngestRequest 배열(최대 100건, 100 × 64KB)을 단일 트랜잭션으로 접수한다. 검증은 전체 원자적 — 한 건이라도 위반이면 400 + errors[].location.pointer = /{index}/{field}, 잡 0개(부분 접수 없음). Idempotency-Key 하나가 배치 전체를 덮는다. jobs[i]는 요청 배열 i 번째; Location 은 jobs[0].status_url. 한도는 ingest 클래스에서 건수로 계량(02 §5).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/Tracestate"
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        description: IngestRequest 배열 1..100
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestBatchRequest"
            example:
              - schema_version: 1.0.0
                collection_id: 01J9ZQ5A1B2C3D4E5F6G7H8J9K
                source_uri: s3://mois-records/regulations/2026/records-management-rule-2026-09.hwpx
                media_type_hint: application/hwp+zip
                external_id: MOIS-REG-2026-0917
                metadata:
                  title: 공공기록물 관리에 관한 법률 시행규칙 일부개정안
                  doc_date: "2026-09-17"
                  doc_type: regulation
                  department: 행정안전부
                  language_hint: ko
                  tags:
                    - 기록물
                    - 시행규칙
                    - 개정안
                  genre: law_article
                acl:
                  allow_principals:
                    - group:mois_records
                  visibility: restricted
                  classification: internal
                  embargo_until: "2026-10-01T00:00:00.000Z"
                pii_policy: mask
                dedup_policy: skip_if_same_hash
                priority: 5
                callback:
                  webhook_url: https://hooks.example.go.kr/rag/ingest
                  events:
