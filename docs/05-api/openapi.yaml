      description: "Accept: text/event-stream 필수. 첫 접속 시 그 잡의 발행된 과거 이벤트를 발행 순으로 먼저 재생한 뒤 실시간으로 이어간다(이미 종결된 잡은 종결 job.state.changed 까지 재생 후 즉시 닫음). 프레임 id = event_id, event = CloudEvents type, data = CloudEventEnvelope 1행. 진행률은 스테이지 경계 단위만 이 스트림으로 나간다 — 페이지·청크 단위 세부 진행률은 GET /v1/jobs/{job_id} 폴링(≥2s) 전용이다(바이블 §14 1.3.0 AM-20 결정 그대로). 종결 이벤트 전달 후 서버가 닫는다. at-least-once — id 로 중복 제거. 테넌트당 동시 SSE 연결 100(초안) 초과 시 429(02 §6.3, 07 §9)."
