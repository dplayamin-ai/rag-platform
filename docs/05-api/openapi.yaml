                    license_grade: A
                    isolation: in_process
                  - plugin_id: index_backend.opensearch
                    version: 1.0.0
                    license_grade: A
                    isolation: in_process
                registered: false
                validated_at: "2026-09-23T01:30:00.000Z"
        "400":
